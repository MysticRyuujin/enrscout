limit_req_zone $binary_remote_addr zone=enrscout_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=enrscout_connections:10m;

server {
  listen 8081;
  listen [::]:8081;
  include /etc/nginx/tls.d/*.conf;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 16k;
  gzip on;
  gzip_min_length 1024;
  gzip_types application/json application/geo+json application/javascript text/css;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; font-src 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = /livez {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/(readyz|healthz)$ {
    access_log off;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    limit_req zone=enrscout_api burst=40 nodelay;
    limit_conn enrscout_connections 20;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    expires 1y;
  }

  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
