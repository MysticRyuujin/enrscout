limit_req_zone $binary_remote_addr zone=enrscout_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=enrscout_connections:10m;

# Preview crawlers skip the SPA. Request values only select fixed strings, so none reach the page.
# $request_uri, not $uri or $arg_*: the try_files fallback drops both.
map $request_uri $enrscout_net {
  default Ethereum;
  "~[?&]network=mainnet(&|$)" Mainnet;
  "~[?&]network=hoodi(&|$)" Hoodi;
  "~[?&]network=sepolia(&|$)" Sepolia;
}

map $request_uri $enrscout_title {
  default "ENRScout - Ethereum Node Explorer";
  "~^/(\?|$)" "ENRScout - $enrscout_net Node Explorer";
  "~^/forks(\?|$)" "$enrscout_net fork readiness - ENRScout";
  "~^/nodes(/execution)?(\?|$)" "$enrscout_net execution nodes - ENRScout";
  "~^/nodes/consensus(\?|$)" "$enrscout_net consensus nodes - ENRScout";
  "~^/nodes/[^/?]+(\?|$)" "Node details - ENRScout";
  "~^/about(\?|$)" "About ENRScout";
}

map $request_uri $enrscout_description {
  default "Live map of Ethereum execution and consensus nodes: clients, versions, and fork readiness from discv4 and discv5.";
  "~^/forks(\?|$)" "Which $enrscout_net nodes advertise the next network upgrade, by client, for the execution and consensus layers.";
  "~^/nodes(/execution)?(\?|$)" "$enrscout_net execution nodes found over discv4 and discv5: clients, versions, and locations.";
  "~^/nodes/consensus(\?|$)" "$enrscout_net consensus nodes found over discv5: clients, versions, and locations.";
  "~^/nodes/[^/?]+(\?|$)" "Discovery record, client, and fork state of one Ethereum node.";
  "~^/about(\?|$)" "How ENRScout crawls the Ethereum discovery network, and what its data can and cannot show.";
}

# og:image must be absolute; an unexpected Host falls back to production.
map $host $enrscout_origin {
  default "https://enrscout.ethnodeops.xyz";
  "~^[a-z0-9.-]+$" "https://$host";
}

server {
  listen 8081;
  listen [::]:8081;
  include /etc/nginx/tls.d/*.conf;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 16k;
  gzip on;
  gzip_min_length 1024;
  gzip_types application/json application/geo+json application/javascript text/css;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; font-src 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = /livez {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/(readyz|healthz)$ {
    access_log off;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    limit_req zone=enrscout_api burst=40 nodelay;
    limit_conn enrscout_connections 20;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    expires 1y;
  }

  location / {
    try_files $uri /index.html;
    expires -1;
    # Each string must match web/index.html exactly, or its tag keeps the default.
    sub_filter_once off;
    sub_filter 'content="ENRScout - Ethereum Node Explorer"' 'content="$enrscout_title"';
    sub_filter 'content="Live map of Ethereum execution and consensus nodes: clients, versions, and fork readiness from discv4 and discv5."' 'content="$enrscout_description"';
    sub_filter 'content="/og.png"' 'content="$enrscout_origin/og.png"';
  }
}
