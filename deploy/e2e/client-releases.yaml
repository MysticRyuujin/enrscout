# ENRScout operator fork file (--fork-file on the crawler, dnspublisher and api).
# cancelled_forks remove a called-off fork from the schedule; they apply at startup,
# so restart all three services after changing them. notices and releases reload in
# the api when the file changes, and an invalid edit keeps the last good version.
# releases is the whole client release table: a client without an entry has no label.
# fork_time is the activation an entry was verified against.
---
updated: 2026-10-22
cancelled_forks:
  # eth-clients/hoodi#33 unscheduled Hoodi Glamsterdam; decided on AllCoreDevs Execution #248.
  - network: hoodi
    fork: Glamsterdam
    el: {name: Amsterdam, time: 1793036568}
    cl: {name: gloas, epoch: 132352, version: "80000910"}
notices:
  - network: hoodi
    fork: Glamsterdam
    severity: critical
    title: Hoodi Glamsterdam is cancelled
    body: |
      The Glamsterdam upgrade planned for Hoodi on 26 October 2026 at 17:42:48 UTC (epoch 132352) is
      cancelled for now. A node on a client release that still schedules it will fork away from Hoodi
      at that time.

      Before then, downgrade to a release without the Hoodi Glamsterdam schedule, or upgrade to a
      release that removes it. This page counts the nodes that still schedule the fork.
    links:
      - {label: "eth-clients/hoodi#33: unschedule Hoodi Glamsterdam", url: "https://github.com/eth-clients/hoodi/pull/33"}
      - {label: "AllCoreDevs Execution #248", url: "https://forkcast.org/calls/acde/248/"}
