name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
      - run: go mod download
      - name: Build
        run: make compile
      - name: Vet and gofmt
        run: make lint
      - name: Staticcheck
        run: make staticcheck
      - name: Test
        run: make test-race
      - name: Reachable Go vulnerabilities
        run: make vulncheck
      - name: Validate Compose files
        run: make validate-compose

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-install
      - name: Audit dependencies
        run: make web-audit
      - name: Build
        run: make web-build

  # Without this, a Dockerfile break first surfaces during a release.
  images:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: crawler
            dockerfile: Dockerfile.crawler
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - component: crawler
            dockerfile: Dockerfile.crawler
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - component: api
            dockerfile: Dockerfile.api
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - component: api
            dockerfile: Dockerfile.api
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - component: web
            dockerfile: web/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - component: web
            dockerfile: web/Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build ${{ matrix.component }} image for ${{ matrix.platform }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=image-${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.component }}-${{ matrix.arch }}

  # Without this, a break in the release's manifest assembly first surfaces during a release.
  # Crawler only: it cross-compiles, so one runner covers both platforms without QEMU.
  manifest-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: localhost:5000/enrscout-crawler
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
      - name: Build both platforms by digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --platform "$platform" -f Dockerfile.crawler \
              --provenance=true --sbom=true \
              --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "$RUNNER_TEMP/meta.json" \
              --cache-from type=gha,scope=ci-manifest-merge \
              --cache-to type=gha,mode=max,scope=ci-manifest-merge .
            digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")"
            touch "$RUNNER_TEMP/digests/${digest#sha256:}"
          done
      - name: Merge and validate
        run: |
          digest="$(.github/scripts/merge-manifest.sh "$IMAGE" "$RUNNER_TEMP/digests" "${IMAGE}:ci")"
          echo "merged ${IMAGE}@${digest}"

  dependency-review:
    # Dependency review requires GitHub Code Security on a private repository.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # The single required status check: matrix job names embed matrix values.
  gate:
    if: always()
    needs: [go, web, images, manifest-merge, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to have succeeded or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "upstream results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) echo "::error::a required job did not succeed"; exit 1 ;;
          esac
