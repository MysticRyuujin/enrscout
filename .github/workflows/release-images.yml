name: Release images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and push (e.g. v0.1.0)
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Add `environment: release` back when public or on Pro - private repos on Free lack environments.
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: crawler
            dockerfile: Dockerfile.crawler
          - component: api
            dockerfile: Dockerfile.api
          - component: web
            dockerfile: web/Dockerfile
    steps:
      - name: Resolve and validate tag
        id: vars
        env:
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          COMPONENT: ${{ matrix.component }}
        run: |
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$RAW_TAG' (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/enrscout-${COMPONENT}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ steps.vars.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout and resolve revision
        id: rev
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          expected="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          head="$(git rev-parse HEAD)"
          if [[ "$head" != "$expected" ]]; then
            echo "::error::Checked-out HEAD ($head) is not tag ${TAG} ($expected)"
            exit 1
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=sha-${{ steps.rev.outputs.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_REVISION=${{ steps.rev.outputs.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VITE_API_BASE=
            VITE_NETWORKS=
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the pushed digest (keyless)
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Publish pinned digest to job summary
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          {
            echo "### enrscout-${COMPONENT}"
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
